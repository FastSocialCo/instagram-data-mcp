[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instagram-data-mcp"
version = "0.1.1"
description = "MCP server for public Instagram data: profiles, posts, reels, stories, highlights, comments, hashtags and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2", "httpx>=0.27", "anyio>=4"]
keywords = ["mcp", "instagram", "model-context-protocol", "instagram-api", "scraper", "claude", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://fastsocial.co/instagram-api"
Documentation = "https://fastsocial.co/instagram-api/docs"

[project.scripts]
instagram-data-mcp = "instagram_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_data_mcp"]
